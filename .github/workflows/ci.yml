name: CI

# Single source of truth for "is this code good?" — server typecheck+tests, a
# live end-to-end run, and a Terraform plan of the Cloudflare edge. Defined ONCE
# here and reused by the release pipeline (release.yml) via `workflow_call`, so the
# exact same jobs gate both merges and releases.
#
# Triggers:
#   - pull_request  → gate every PR (path-filtered: only the areas that changed
#                     run, so a server-only PR skips the Terraform job).
#   - workflow_call → release.yml invokes this before building. On that
#                     path the full suite always runs (see the `if:` below) so
#                     nothing ships untested.
# Deliberately NOT triggered on `push`: pushes to main/preprod are handled by
# release.yml (which calls this), avoiding a double CI run on those branches.
#
# There is deliberately NO macOS job here. It ran on every push to main/preprod
# via the workflow_call path and, at the 10x macOS billing multiplier with
# per-job minute round-up, was 84% of the entire Actions bill. Apple builds are
# verified locally instead — see apps/apple/verify.sh.
#
# The `e2e` job runs on every PR, and the reason is worth recording because it
# was briefly gated behind a `run-e2e` label. That gate was a response to the
# job costing ~17 minutes a push — but the cost was never the suite. It was two
# bugs: a promise that could not settle when the broker disconnected a client
# (test/helpers/mqtt-client.ts `publishRaw`), and a 15-minute `timeout-minutes`
# that billed the full quarter-hour every time the first one hit.
#
# With those fixed the nine tests take SIXTEEN SECONDS. There is no case for
# gating that, and every case for running the only job that exercises a real
# broker on every change that touches the server.
#
# It also runs on `workflow_call`, so nothing reaches a release untested, and
# locally with no runner at all: services/server/test/e2e/run-local.sh.
on:
  pull_request:
  workflow_call:

# `pull-requests: read` is what makes the path filter work. dorny/paths-filter
# asks the Files API which files a PR touched, and without that scope the token
# gets `Resource not accessible by integration` — the `changes` job FAILS, every
# job that needs it is skipped, and the PR goes green having run nothing.
#
# That is not hypothetical: it is how the Redis-to-Postgres migration merged
# without its end-to-end suite ever executing, and the schema it shipped could
# not accept a single real user (see services/server/services/db/migrations/
# 001_schema.sql, section 0).
permissions:
  contents: read
  pull-requests: read

# One CI run per branch; a new push supersedes the old one instead of paying for
# both. Safe to cancel: nothing here touches the outside world.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which areas changed so PRs only pay for the jobs they need.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.filter.outputs.server }}
      edge: ${{ steps.filter.outputs.edge }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # These globs must track the real layout (services/, apps/, infra/).
          # They previously read 'server/**' and 'apple/**' — paths that stopped
          # existing when the repo was reorganised — so every filter evaluated
          # false and PR CI silently ran nothing at all.
          filters: |
            server:
              - 'services/server/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            edge:
              - 'infra/cloudflare/**'
              - 'apps/site/**'
              - '.github/workflows/ci.yml'

  # ---------------------------------------------------------------------------
  # Server: typecheck + unit tests
  # ---------------------------------------------------------------------------
  server:
    needs: changes
    # Run when server code changed on a PR, OR always when reused by release.yml
    # (a deploy re-tests everything regardless of what the last commit touched).
    if: needs.changes.outputs.server == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # The unit suite skips its database-backed tests when there is nothing to
      # connect to (test/pg-helper.ts), which is the right behaviour on a laptop
      # and the wrong one here: without this, sessions, rate limits, admission
      # and the whole subscription claim went UNTESTED on every run and the job
      # still went green.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hqcat
          POSTGRES_PASSWORD: hqcat
          POSTGRES_DB: hqcat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hqcat -d hqcat" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: services/server
    env:
      DATABASE_URL: postgresql://hqcat:hqcat@localhost:5432/hqcat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/server/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Migrate
        run: npm run migrate
      - name: Unit tests
        run: npm test

  # ---------------------------------------------------------------------------
  # End-to-end: two real protocol clients through a live server (open admission).
  # ---------------------------------------------------------------------------
  e2e:
    needs: changes
    if: needs.changes.outputs.server == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 5, not 15. The suite is ~16 seconds and the job about a minute, nearly all
    # of it pulling the EMQX image. The old 15 was not headroom, it was the bill
    # for a hang: a test that could never settle ran until the cap, twice. This
    # is now a real ceiling — if the job reaches it, something is stuck, and the
    # sooner that is said the better.
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hqcat
          POSTGRES_PASSWORD: hqcat
          POSTGRES_DB: hqcat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hqcat -d hqcat" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: services/server
    env:
      ADMISSION_POLICY: open
      DATABASE_URL: postgresql://hqcat:hqcat@localhost:5432/hqcat
      PORT: "8080"
      TEST_AUTH_URL: http://localhost:8081
      TEST_API_URL: http://localhost:8080
      TEST_EMQX_URL: ws://localhost:8083/mqtt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/server/package-lock.json
      - run: npm ci
      - name: Migrate
        run: npm run migrate
      - name: Start services
        run: |
          PORT=8080 npm run api  > /tmp/api.log  2>&1 &
          PORT=8081 npm run auth > /tmp/auth.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null \
               && curl -fsS http://localhost:8081/health >/dev/null; then
              echo "services up"; break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8080/health \
            || (echo "api did not start"; cat /tmp/api.log; exit 1)
          curl -fsS http://localhost:8081/health \
            || (echo "auth did not start"; cat /tmp/auth.log; exit 1)
      # The broker, with the REAL config — rendered from the same template the
      # deployment uses (infra/deploy/emqx/emqx.conf).
      #
      # It used to be a plain `emqx/emqx:5.8` service container, which cannot
      # mount a config file: service containers start before checkout, so there
      # is nothing on disk to give them. That meant EMQX ran on its stock
      # config, which authorizes everything — so "the topic ACL refuses a
      # stranger" could not have passed, and no test here ever exercised the
      # authorizer that is the entire barrier between conversations.
      #
      # It starts AFTER the API and auth, and that ordering is load-bearing.
      # Started before them, EMQX's HTTP authn connector fails its first
      # connect (`start_resource_failed, reason: econnrefused`), marks the
      # resource down, and refuses every CONNECT with `not_authorized` until it
      # retries. It recovered six seconds after the tests had already run and
      # failed — a race that looks exactly like a broken token.
      #
      # Two substitutions differ from production and both are deliberate:
      # TLS to Postgres is off (the service container speaks none), and the
      # authn hook points at the runner's host gateway instead of a compose
      # service name. Everything else — the query, no_match = deny,
      # deny_action = disconnect — is what ships.
      #
      # The authn substitution rewrites only host:port, leaving the template's
      # own scheme in place. Both are plain HTTP over the docker bridge, as in
      # the compose deployment — writing a second `http://` literal here just
      # added a clear-text-protocol finding for no change in behaviour.
      - name: Start EMQX with the deployment's authorizer
        working-directory: .
        run: |
          set -e
          # Three substitutions exist because CI reaches Postgres DIRECTLY while
          # production reaches it through PgBouncer. They are not cosmetic:
          #
          #   ssl off              the service container speaks no TLS
          #   cacertfile deleted   unused with ssl off, and an empty PEM is a
          #                        plausible way to load-but-never-connect
          #   prepared statements  RE-ENABLED. Production must disable them
          #                        because named statements do not survive
          #                        PgBouncer handing a backend to someone else
          #                        mid-transaction. Against a direct Postgres
          #                        that same setting makes EVERY authz query
          #                        fail with `26000 invalid_sql_statement_name:
          #                        unnamed prepared statement does not exist`,
          #                        and a failed authz query means no_match =
          #                        deny, which means deny_action = disconnect.
          #                        The symptom is every client dropped at
          #                        SUBACK — indistinguishable from a missing
          #                        ACL row until you read the broker log.
          #
          # If production ever stops using PgBouncer, that third line flips back
          # and this comment is the reason why.
          sed -e "s|__PG_SERVER__|172.17.0.1:5432|" \
              -e "s|__PG_HOST__|172.17.0.1|" \
              -e "s|__PG_DATABASE__|hqcat|" \
              -e "s|__PG_USERNAME__|hqcat|" \
              -e "s|__PG_PASSWORD__|hqcat|" \
              -e "s|__PG_SSL__|false|" \
              -e "/cacertfile = /d" \
              -e "s|disable_prepared_statements = true|disable_prepared_statements = false|" \
              -e "s|//auth:8080/mqtt/authn|//172.17.0.1:8081/mqtt/authn|" \
              infra/deploy/emqx/emqx.conf > /tmp/emqx.conf
          docker run -d --name emqx \
            --add-host host.docker.internal:host-gateway \
            -p 1883:1883 -p 8083:8083 \
            -v /tmp/emqx.conf:/opt/emqx/etc/emqx.conf:ro \
            emqx/emqx:5.8
          for i in $(seq 1 40); do
            if docker exec emqx emqx ctl status >/dev/null 2>&1; then
              echo "emqx up"; break
            fi
            sleep 2
          done
          docker exec emqx emqx ctl status \
            || (echo "emqx did not start"; docker logs emqx; exit 1)
          # A failed `sed` silently boots the broker on a config full of literal
          # placeholders. Certain to detect, so fatal — the same failure the
          # compose entrypoint uses `set -e` to prevent.
          ! grep -q "__PG_" /tmp/emqx.conf \
            || (echo "emqx.conf still has unrendered placeholders:"; \
                grep -n "__PG_" /tmp/emqx.conf; exit 1)
          docker exec emqx emqx ctl conf show authorization 2>/dev/null \
            | grep -q postgresql \
            && echo "postgresql authorizer loaded" \
            || echo "WARNING: could not confirm the postgresql authorizer"
          # Wait out the auth resources. Started before the API and auth, EMQX's
          # webhook connector fails its first connect and denies every CONNECT
          # until it retries; the authz source can lag the same way. Both look
          # exactly like a bad credential, so wait rather than race.
          for i in $(seq 1 30); do
            docker exec emqx emqx ctl alarms list 2>/dev/null \
              | grep -qiE "authn|authz|resource" || break
            echo "waiting for the auth resources to come up"; sleep 2
          done
          # An authz source that LOADED but never CONNECTED denies every topic,
          # which is indistinguishable from a missing ACL row. Surface it here.
          docker logs emqx 2>&1 | grep -iE "authz|postgres" | tail -20 || true
      - name: E2E tests
        run: npm run test:e2e
      # `always()`, not `failure()`. A job killed by `timeout-minutes` is
      # CANCELLED, not failed, so `failure()` skips — and the one run that most
      # needed the broker log was the one that did not produce it.
      - name: Service logs
        if: always()
        run: |
          echo "── api ──"; cat /tmp/api.log || true
          echo "── auth ──"; cat /tmp/auth.log || true
          echo "── emqx ──"; docker logs emqx 2>&1 | tail -120 || true
          echo "── mqtt_acl rows ──"
          # Uses the job's existing DATABASE_URL rather than restating the
          # credential. A second literal here is one more thing to keep in sync
          # and, being password-shaped, one more thing for a secret scanner to
          # flag — which is exactly what it did.
          psql "$DATABASE_URL" \
            -c "select id, topic, action from mqtt_acl order by id, topic limit 40;" || true
          echo "── emqx authz status ──"
          docker exec emqx emqx ctl conf show authorization 2>&1 | head -40 || true

  # ---------------------------------------------------------------------------
  # Cloudflare edge: prove the Terraform is valid before it reaches the deploy
  # pipeline. The matching `plan`+`apply` live in release.yml, which has the
  # credentials, so the edge and the origin roll out together.
  #
  # This job is deliberately credential-free and backend-free:
  #   - Cloudflare/R2 creds are GitHub *Environment* secrets, so reading state
  #     would mean putting `environment: production` on a PR job. That currently
  #     works only because production has no protection rules; the moment the
  #     required-reviewer gate from docs/runbooks/deploy.md §7 is enabled, every
  #     PR would block waiting for a human to approve a read-only plan.
  #   - It also keeps fork PRs from reaching a write-scoped token.
  # `validate` catches the class of breakage that actually bit us (a moved file
  # making the module unloadable). For a state-aware diff, run `terraform plan`
  # locally, or watch the plan step in the release run.
  # ---------------------------------------------------------------------------
  cloudflare-plan:
    needs: changes
    if: needs.changes.outputs.edge == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/cloudflare
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5" # >= 1.10 for native S3/R2 state locking
      - name: Format check (advisory)
        continue-on-error: true
        run: terraform fmt -check -recursive
      # No backend and no credentials: a PR from a fork must not be able to read
      # remote state, and `validate` does not need it. The real plan against
      # state happens in release.yml, which has the secrets.
      - name: Init (no backend)
        run: terraform init -input=false -backend=false
      - name: Validate
        run: terraform validate

      # The Worker script Terraform ships is apps/site/src/index.js, and until
      # now nothing checked it — CI validated the Terraform around it and never
      # the code inside. These tests are why the site's CSP still names the
      # Stripe origin: without it the subscribe button dies silently.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Site tests
        working-directory: apps/site
        run: node --test test/*.test.mjs
