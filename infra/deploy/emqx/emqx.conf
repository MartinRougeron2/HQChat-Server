## DissQus EMQX config TEMPLATE (Phase 0 — see deploy/EXTRACTION_PLAN.md).
##
## Secrets are NOT in this file. It is mounted read-only at
## /emqx.conf.template and rendered to /opt/emqx/etc/emqx.conf at container
## start (see the emqx service in ../docker-compose.yml), which substitutes:
##
##   __PG_SERVER__ __PG_HOST__ __PG_DATABASE__ __PG_USERNAME__ __PG_PASSWORD__
##   __PG_SSL__
##       ← /run/secrets/emqx_pg, a file of shell assignments the entrypoint
##         sources. One file rather than environment variables because EMQX
##         treats env vars as config overrides, so an unrecognised one is a boot
##         failure rather than a value it ignores.
##
## Templating rather than an env override is deliberate: EMQX cannot override an
## element of an ARRAY config (authorization.sources) from the environment — see
## the comment on the authorizer below. The dashboard password still arrives as
## EMQX_DASHBOARD__DEFAULT_PASSWORD (a map field, which env overrides handle) and
## is re-synced after boot by the same entrypoint.

node {
  name = "emqx@127.0.0.1"
  cookie = "dissqus-emqx-cookie-change-me"
  data_dir = "/opt/emqx/data"
}

## --- Listeners --------------------------------------------------------------
## nginx terminates public TLS and proxies wss://DOMAIN/mqtt → this plain WS
## listener on the internal network. Raw TCP / native TLS listeners are disabled
## behind nginx (unify all clients on MQTT-over-WSS/443).
listeners.ws.default {
  bind = "0.0.0.0:8083"
  websocket.mqtt_path = "/mqtt"
}
listeners.tcp.default { enable = false }
listeners.ssl.default { enable = false }
listeners.wss.default { enable = false }

## --- Authentication: opaque token via the auth-server HTTP hook -------------
## No JWT. EMQX POSTs { username=pk, password=token, clientid } to the auth
## server, which one-time-consumes the token (replay-proof) and returns
## {"result":"allow"|"deny"}. clientid is set to the pk by the client so the
## authorizer below can key the ACL on it.
authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://auth:8080/mqtt/authn"
    headers { "content-type" = "application/json" }
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }
    request_timeout = "5s"
  }
]

## --- Authorization (RLS): PostgreSQL authorizer on the friend-hash topic ACL --
## On a cache miss, EMQX runs the query below for the connecting clientid (the
## client sets clientid = its public key). App-API writes these rows on friend
## accept and removes them on unfriend, so authorization is live.
##
## no_match = deny + deny_action = disconnect: unknown topics are refused and a
## client that tries one is dropped.
authorization {
  no_match = deny
  deny_action = disconnect

  ## 15m, not 1m. The lookup is NOT on the message path — it runs once per
  ## client-topic per cache window — so this number decides the query rate
  ## against the database, and 15m cuts it about fifteenfold.
  ##
  ## The reason it is safe to lengthen is that revocation no longer waits for
  ## this clock: unfriending and a lapsed subscription both call lib/emqx.ts,
  ## which drops the live subscription through the admin API, and the row is
  ## deleted regardless. What remains exposed for the window is a client that
  ## RECONNECTS inside it — and the only thing it could reach is presence
  ## metadata, since conversation content is end-to-end encrypted with keys the
  ## revoked peer does not get.
  ##
  ## It also buys resilience: the cluster is single-node, so its maintenance
  ## window is a restart, and a cached grant rides straight through one.
  cache { enable = true, ttl = "15m" }

  sources = [
    {
      type = postgresql
      enable = true
      ## Rendered at container start. Do NOT turn these into env overrides:
      ## authorization.sources is an ARRAY, and EMQX_AUTHORIZATION__SOURCES__1__*
      ## is ignored (or fails validation with `missing_type_field`) on 5.0.25+ —
      ## emqx/emqx#10264, emqx/emqx#14587. The symptom is a `disconnected` source,
      ## i.e. an ACL that never matches, while everything else looks healthy.
      ## broker-watch polls for exactly that.
      server = "__PG_SERVER__"
      database = "__PG_DATABASE__"
      username = "__PG_USERNAME__"
      password = "__PG_PASSWORD__"
      pool_size = 2

      ## The endpoint is a PgBouncer pool in TRANSACTION mode (the cluster allows
      ## 22 backend connections in total across both stacks — see
      ## infra/database/README.md). Named prepared statements do not survive a
      ## backend being handed to someone else between statements, so they have to
      ## be off. Leaving this false is the failure that looks like a working
      ## config until the first authz query.
      disable_prepared_statements = true

      ## DigitalOcean requires TLS and publishes a CA; verify_peer against it
      ## means a redirected host fails the handshake instead of quietly serving.
      ## Templated only so the local/CI overlay can point this at a plain
      ## postgres container that speaks no TLS at all — production never sets
      ## AUTHZ_PG_SSL to anything but the default.
      ssl {
        enable = __PG_SSL__
        verify = verify_peer
        cacertfile = "/run/secrets/pg_ca_cert"
        server_name_indication = "__PG_HOST__"
      }

      ## `permission` is not stored: every row in this table is a grant, and
      ## no_match = deny handles the rest. Same shape as the HGETALL it replaces.
      query = "SELECT 'allow' AS permission, action, topic FROM mqtt_acl WHERE pk = ${clientid}"
    }
  ]
}

## --- Dashboard (localhost only; reach via SSH tunnel) -----------------------
## One command from a laptop: deploy/scripts/emqx-dashboard.sh [prod|preprod]
dashboard {
  listeners.http { bind = "0.0.0.0:18083" }
  default_username = "admin"
  default_password = "public"  ## overridden by EMQX_DASHBOARD__DEFAULT_PASSWORD
}
