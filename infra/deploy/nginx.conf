# HQCAT / DissQus nginx — origin behind Cloudflare (Cloudflare terminates the
# public TLS). Place at /etc/nginx/sites-available/hqcat, symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
# Replace chat.example.com with YOUR_DOMAIN.
#
# The services run in Docker, each bound to a localhost port (see
# deploy/docker-compose.yml): emqx 8083, auth 8090, app-api 8091. nginx is the
# only thing the host exposes publicly.
#
# Recommended Cloudflare SSL/TLS mode: "Full (strict)" with a Cloudflare Origin
# Certificate installed below. SECURITY: do NOT use "Flexible" — it leaves the
# Cloudflare↔origin hop unencrypted. Also firewall :443 to Cloudflare's IP
# ranges (ufw/iptables) so nobody can reach the origin IP directly.

# Rate limit for the plain-HTTP API surface (/health, /auth/*, /friends,
# /stripe/webhook, /donate…). The MQTT WebSocket is long-lived and excluded
# from this zone.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# `zone=claim` protected /claim/*, where every call could send an email and the
# cost of abuse was our mail reputation and our Resend bill. The claim flow went
# with the paywall and nothing in this stack sends mail now, so the zone is gone
# with it.

# Starting checkout (POST /donate/checkout) calls Stripe. It is unauthenticated by
# necessity — nobody has an account yet — so without a bucket anyone can make us
# create Stripe Checkout sessions in a loop, on our API quota and against our
# rate limits with Stripe.
#
# An older version of that page was protected by accident: it demanded a valid
# 64-character linking code before it would call Stripe. That form is gone, and
# the accidental gate with it, so the limit is deliberate. It matters slightly
# more than it did — the page is now reachable by anyone rather than being the
# last step of a purchase funnel.
#
# An empty key is not counted by limit_req, so GET (a static page) is untouched
# and only the POST is metered.
map $request_method $checkout_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $checkout_limit_key zone=checkout:10m rate=10r/m;

# --- Restore the real client IP from Cloudflare ----------------------------
# Without this, $remote_addr is Cloudflare's edge IP. Refresh the ranges from
# https://www.cloudflare.com/ips/ periodically.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# --- Origin over HTTPS (Cloudflare Full / Full-strict) ----------------------
server {
    # http2 as a `listen` parameter (not the standalone `http2 on;` directive) so
    # this works on nginx < 1.25.1 too — Ubuntu 24.04 ships 1.24, which errors on
    # `http2 on;`. Deprecation-warns on 1.25.1+ but `nginx -t` still passes.
    listen 443 ssl http2;
    server_name chat.example.com;

    # Don't advertise the nginx version.
    server_tokens off;

    # Generated in Cloudflare → SSL/TLS → Origin Server → Create Certificate.
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Message payloads ride the MQTT socket, not HTTP. Keep the HTTP body small
    # to blunt abuse (Stripe webhooks are well under this).
    client_max_body_size 1m;

    # Baseline security headers (HSTS is safe here — Cloudflare forces HTTPS).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # --- MQTT (see deploy/EXTRACTION_PLAN.md) -------------------------------
    # MQTT-over-WebSocket → EMQX (docker-compose.yml, localhost:8083). This is
    # the ONLY long-lived client connection; no rate limit. It replaced the `/ws`
    # monolith socket at Phase 4 — there is no /ws location here any more, and
    # nothing is listening on 8080.
    location /mqtt {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # `location /claim/` stood here, routing the email+OTP subscription claim to
    # the auth server on 8090 — it needed stating explicitly because every other
    # non-/auth path proxies to app-api on 8091. Both the routes and the flow are
    # gone with the paywall, so the catch-all may have the path back.

    # Auth server (HQC handshake + token) → localhost:8090.
    location /auth/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- REST control plane → app-api (localhost:8091) ----------------------
    # The iOS/macOS client (APIClient.swift) calls these paths directly against
    # the root origin. They are kept as explicit, more-specific prefixes rather
    # than leaning on `location /` so the rate-limit and the upstream for the
    # app's own surface are stated, not inherited.
    #
    # /stripe, /donate and /supporters live here too: they used to reach the
    # monolith through the catch-all, and app-api (api/main.ts) is what serves
    # /stripe/webhook, /donate/* and /supporters now.
    #
    # Note what is NOT here: bare /donate. That path is a Cloudflare Worker route
    # (the marketing page) and never reaches this origin, while /donate/checkout,
    # /donate/thanks and /donate/cancelled fall through to app-api because the
    # Worker matches exact paths only. The `location /donate` prefix below
    # therefore only ever sees the sub-paths.
    location /friends   { limit_req zone=api burst=40 nodelay; proxy_pass http://127.0.0.1:8091; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /username  { limit_req zone=api burst=40 nodelay; proxy_pass http://127.0.0.1:8091; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /users     { limit_req zone=api burst=40 nodelay; proxy_pass http://127.0.0.1:8091; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /push      { limit_req zone=api burst=40 nodelay; proxy_pass http://127.0.0.1:8091; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /account   { limit_req zone=api burst=40 nodelay; proxy_pass http://127.0.0.1:8091; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /stripe    { limit_req zone=api burst=40 nodelay; proxy_pass http://127.0.0.1:8091; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    # Both buckets apply: `api` bounds page loads, `checkout` bounds the POST
    # that spends a Stripe API call. nginx enforces every limit_req in a
    # location, so the stricter one wins for POSTs.
    location /donate {
        limit_req zone=api burst=40 nodelay;
        limit_req zone=checkout burst=3 nodelay;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /supporters { limit_req zone=api burst=40 nodelay; proxy_pass http://127.0.0.1:8091; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

    # Everything else (/health…) → app-api, which is the only general-purpose
    # HTTP surface left now that the monolith on 8080 is retired.
    location / {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Plain HTTP :80 — redirect everything to HTTPS --------------------------
# With Cloudflare "Always Use HTTPS" on, clients won't normally hit this; it's a
# safety net for direct/origin hits. (No WS here — wss only.)
server {
    listen 80;
    server_name chat.example.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}
